# Dims/Coordinates
# Based on:
# https://github.com/CABLE-LSM/CABLE/blob/520274fd2932a1211ba161d8893f7544a689130d/src/offline/cable_input.F90#L522
# https://github.com/CABLE-LSM/CABLE/blob/520274fd2932a1211ba161d8893f7544a689130d/src/offline/cable_metutils.F90#L33
# Currently, require dimensions variables `lat`/`lon` (as backup to `x`/`y`)  and coordinates `lat`/`lon`
# Better not to mix up different names for dimensions/coordinates

lat:
  type: coordinate
  dim: y
  input_param:
    - latitude
    - lat

lon:
  type: coordinate
  dim: x
  input_param:
    - longitude
    - lon

# Standard Params

Tair:
  type: standard
  input_param:
    - tavg
    - temp
    - t2m
  unit:
    kelvin
SWdown:
  type: standard
  input_param:
    - srad
    - ssrd
  unit:
    W m-2
Qair:
  type: standard
  input_param:
    - Qair
  unit:
    kg kg-1
  calc:
    - deps:
        vp,vpd,Tair
      func:
        vp_vpd_tair_sh
    - deps:
        vp,Tair
      func:
        vp_tair_sh
    - deps:
        vpd,Tair
      func:
        vpd_tair_sh
    - deps:
        PSurf,dewp
      func:
        sp_dewp_sh
        
Rainf:
  type: standard
  input_param:
    - rain
    - tp
  unit:
    mm/s
    # kg m-2 s-1 (JULES)

Wind:
  type: standard
  unit:
    m/s
  calc:
  - deps:
      wind_e,wind_n
    func:
      wind_speed

# In between params
vpd:
  type: 
    conversion
  input_param:
    - vpd

dewp:
  type: 
    conversion
  input_param:
    - d2m

wind_e:
  type: 
    conversion
  unit:
    m/s
  input_param:
    - u10
wind_n:
  type: 
    conversion
  unit:
    m/s
  input_param:
    - v10

elevation:
  type: conversion
  input_param:
    - dem01
  unit:
    m

tmax:
  type: conversion

tmin:
  type: conversion

# Optional Params
LWdown:
  type: optional
  input_param:
    - strd
  calc:
    - deps:
        Tair
      func:
        calc_lwdown_swinbank
  unit:
    W m-2
PSurf:
  type: optional
  input_param:
    - sp
  calc:
    - deps:
        Tair,elevation
      func:
        calc_psurf
  unit:
    Pa
Snowf:
  type: optional
  unit:
    mm/s
  input_param:
    - sf
  calc:
    - deps:
        Tair,Rainf
      func:
        calc_snow

CO2air:
  type: optional
  unit:
    ppm
  calc:
    - func:
        default_co2

