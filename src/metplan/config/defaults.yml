# Gadi Project
project: {{ PROJECT | default('TEST_PROJECT') }}

# Encoding
encoding:
  zlib: true
  complevel: 5
  shuffle: true
  dtype: float64

# Encoding overrides
encoding_overrides:
  landsea:
    dtype: int32
    _FillValue: null

# Write arguments
to_netcdf:
  format: NETCDF4
  engine: netcdf4

# Cluster settings for running on PBS (NCI)
cluster_pbs:
  n_workers: 1
  # threads_per_worker: 4
  processes: true

job_pbs:
  mem: 80G
  jobfs: 100GB
  walltime: "01:00:00"
  storage:
   - "gdata/xp65"
   - "gdata/tm70"
   - "gdata/zz93"
  ncpus: 24

# Cluster settings for running locally
cluster_local:
  n_workers: 1

debug:
  single_day: true

# Outputs
output_dir: /scratch/{{ PROJECT | default('TEST_PROJECT') }}/{{ USER | default('TEST_USER') }}/metplan